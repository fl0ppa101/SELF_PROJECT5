[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hall-sensors"
version = "3.0.0"
description = "Датчики Холла — виртуальная лаборатория магнитного поля"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyQt6>=6.6,<7", "pyqtgraph>=0.13.7,<0.15", "openpyxl>=3.1,<4"]

[project.gui-scripts]
hall-sensors = "hallsim.app.bootstrap:run"

[tool.setuptools.packages.find]
include = ["hallsim*"]

[tool.setuptools.package-data]
hallsim = ["resources/qss/*.qss", "resources/icons/*.svg"]
